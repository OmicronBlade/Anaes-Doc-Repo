<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <meta name="robots" content="noindex">
  <title>Anaesthesia Forms</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b5c8a'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <main class="page">
    <header class="site-header">
      <p class="eyebrow">Department of Anaesthesia</p>
      <h1 id="site-title">Anaesthesia Forms</h1>
      <p id="site-subtitle"></p>
    </header>

    <div class="toolbar">
      <label class="search">
        <span class="visually-hidden">Search documents</span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>
        </svg>
        <input id="search" type="search" placeholder="Search documents" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div id="chips" class="chips" role="group" aria-label="Filter by category"></div>
    </div>

    <p id="count" class="visually-hidden" aria-live="polite"></p>
    <div id="list"></div>

    <footer class="site-footer">
      <div class="privacy">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/>
        </svg>
        <span>Forms are completed entirely in your browser. Nothing you enter is sent to or stored on a server. Use <em>Print → Save as PDF</em> to keep a copy.</span>
      </div>
      <div class="footer-meta">
        <span id="credits" class="credits"></span>
        <span class="screen-only">Site <span id="site-version"></span></span>
      </div>
    </footer>
  </main>

  <script src="assets/js/documents.js"></script>
  <script src="assets/js/index.js"></script>
</body>
</html>
